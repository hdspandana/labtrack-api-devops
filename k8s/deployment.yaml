apiVersion: apps/v1
kind: Deployment
metadata:
  name: labtrack-deployment
  labels:
    app: labtrack-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: labtrack-api
  template:
    metadata:
      labels:
        app: labtrack-api
    spec:
      containers:
        - name: labtrack-api
          image: labtrack-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: labtrack-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
